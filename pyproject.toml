[project]
name = "docrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "evasangwan", email = "esangwan@go.pasadena.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.7.22",
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-ollama>=1.1.0",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
]

[project.scripts]
docrag = "docrag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
